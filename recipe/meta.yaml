{% set name = "xbudget" %}
{% set version = "0.8.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/x/xbudget/xbudget-{{ version }}.tar.gz
  sha256: d813eda4a9ca00527a2ec4b6186634a5c5b56b4557b8311cce2be488a680708f

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >={{ python_min }}
    - cf-units
    - numpy
    - pyyaml
    - xarray
    - xgcm >=0.10.0

test:
  requires:
    - python {{ python_min }}
  imports:
    - xbudget

about:
  home: https://github.com/hdrake/xbudget
  summary: Helper functions and metadata recipes for wrangling finite-volume ocean model budgets
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hdrake
